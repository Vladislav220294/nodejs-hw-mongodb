type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: 681f85e189cbd75c76898bbc
  name:
    type: string
    description: Contact name
    example: Jo Jonse
  phoneNumber:
    type: string
    description: Contact phone number
    example: +3806655221
  email:
    type: string
    description: Contact email
    example: lon@gmail.comming
  isFavourite:
    type: boolean
    description: Favourite or not
    example: true
    default: false
  contactType:
    type: string
    description: Type of contact
    enum: ['work', 'home', 'personal']
    example: work
  userId:
    type: string
    description: Contact owner id
    example: 681f85e189cbd75c76898bbc
  photo:
    type: string
    format: url
    description: Contact photo url
    example: 'https://res.cloudinary.com/dd5eglpta/image/upload/v1749471806/n9wrevoduyrgvrvu2zxa.png'
  createdAt:
    type: string
    format: date-time
    description: Contact created application
    example: 2025-06-09T12:23:26.461+00:00
  updatedAt:
    type: string
    format: date-time
    description: Contact updated application
    example: 2025-06-10T12:23:26.461+00:00
